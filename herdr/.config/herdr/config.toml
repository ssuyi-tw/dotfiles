onboarding = false

[theme]
# herdr's own compiled palette, independent of the terminal. Gives the surface/
# overlay greys that ANSI has no slot for, at the cost of not tracking ghostty:
# retheme ghostty and this chrome stays gruvbox. Use "terminal" to follow it.
name = "gruvbox"
auto_switch = false

[keys]
# skhd owns the whole alt layer, so alt+* never reaches herdr — every
# alt-based binding in herdr's docs is a dead key on this machine.
# ctrl+b is also tmux's prefix: press it twice to send a literal ctrl+b through.
prefix = "ctrl+b"

# Tabs
next_tab = ["prefix+n", "ctrl+right"]
previous_tab = ["prefix+p", "ctrl+left"]
switch_tab = "ctrl+1..9"

# Spaces (workspaces) — unbound by default; n/p one level up from tabs
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+ctrl+p"
next_workspace = "prefix+ctrl+n"

# Agent rows in the sidebar — vertical list, vim directions
previous_agent = "prefix+ctrl+k"
next_agent = "prefix+ctrl+j"
focus_agent = "prefix+ctrl+1..9"

# Back-and-forth between the last two panes
cycle_pane_next = "prefix+ctrl+tab"
last_pane = "prefix+tab"

[[keys.command]]
key = "prefix+ctrl+l"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

[ui]
agent_panel_sort = "spaces"
tab_bar_position = "top"

# Sidebar visible on launch — the surface layering is the point. prefix+b
# collapses it to the compact status rail when a tiled window gets narrow.
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"
pane_scrollbars = false
hide_tab_bar_when_single_tab = true

# Skip the name prompt on prefix+c
prompt_new_tab_name = false

[ui.toast]
# You are usually on another yabai space when an agent finishes.
delivery = "system"
